name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/01a0a6ae-release"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # cache: true => Flutter SDK + pub packages (keyed by pubspec.lock)
      - name: Set up Flutter (stable) with SDK/pub cache
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Record Flutter version
        id: fv
        run: echo "version=$(flutter --version | head -n1 | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Gradle distribution + all Maven dependencies (AGP, Kotlin, plugins)
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-jdk21-${{ hashFiles('tijarti-android/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'tijarti-android/mobile/android/build.gradle.kts', 'tijarti-android/mobile/android/settings.gradle.kts', 'tijarti-android/mobile/android/app/build.gradle.kts', 'tijarti-android/mobile/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-jdk21-

      # Android SDK components installed by flutter (platforms/build-tools)
      - name: Cache Android SDK components
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
          key: android-sdk-${{ runner.os }}-flutter-${{ steps.fv.outputs.version }}
          restore-keys: |
            android-sdk-${{ runner.os }}-flutter-

      - name: Flutter version
        run: flutter --version

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses

      - name: Pre-cache Android artifacts
        run: flutter precache --android

      - name: Cap Gradle heap for 7GB runner
        run: |
          sed -i 's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m|' tijarti-android/mobile/android/gradle.properties
          grep org.gradle.jvmargs tijarti-android/mobile/android/gradle.properties

      - name: Pub get
        working-directory: tijarti-android/mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: tijarti-android/mobile
        run: flutter build apk --release

      - name: Locate built APK
        run: |
          find tijarti-android -name "*.apk" -type f
          echo "---- outputs dir ----"
          ls -lh tijarti-android/mobile/build/app/outputs/flutter-apk/ 2>/dev/null || true

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tijarti-mobile-release-apk
          path: tijarti-android/mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit APK to repository
        # Keeps a dated copy in the repo so it can be fetched directly from git.
        # Skipped when this run was triggered by the APK commit itself (loop guard).
        if: |
          github.event_name == 'workflow_dispatch' ||
          !startsWith(github.event.head_commit.message, 'Build Tijarti Android release APK')
        continue-on-error: true
        run: |
          APK_NAME="Tijarti-Android-$(date +%Y%m%d).apk"
          cp "tijarti-android/mobile/build/app/outputs/flutter-apk/app-release.apk" "$APK_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$APK_NAME"
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to commit."
          else
            git commit -m "Build Tijarti Android release APK ($(date +%Y%m%d))"
            git push origin HEAD
            echo "Committed $APK_NAME"
          fi
