name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/01a0a6ae-release"
  pull_request:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses

      - name: Pre-cache Android artifacts
        run: flutter precache --android

      - name: Cap Gradle heap for 7GB runner
        run: |
          sed -i 's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m|' tijarti-android/mobile/android/gradle.properties
          grep org.gradle.jvmargs tijarti-android/mobile/android/gradle.properties

      - name: Pub get
        working-directory: tijarti-android/mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: tijarti-android/mobile
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tijarti-mobile-release-apk
          path: tijarti-android/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
