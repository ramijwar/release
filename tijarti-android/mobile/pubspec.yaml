name: tijarti_mobile
description: "Tijarti Arabic marketplace and local shopping application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  firebase_core: ^4.3.0
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.5.0
  flutter_secure_storage: ^10.0.0
  sqflite: ^2.4.2
  path: ^1.9.1
  connectivity_plus: ^7.0.0
  cached_network_image: ^3.4.1
  image_picker: ^1.2.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
